[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onerec-lasar"
version = "0.1.0"
description = "LASAR reproduction on the OneRec-Think data pipeline"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "sentence-transformers>=3.0",
  "torch>=2.4",
  "datasets>=3.0",
  "safetensors>=0.4.5",
  "numpy>=1.24",
  "requests>=2.32",
  "peft>=0.15",
  "transformers>=4.51",
]

[tool.setuptools]
packages = ["lasar"]
